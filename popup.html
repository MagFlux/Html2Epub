<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML to EPUB</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <p class="eyebrow">HTML TO EPUB</p>
      <h1>Save the good part.</h1>
      <p class="intro">Extract the page's title and readable article content.</p>
      <label class="option">
        <input id="include-images" type="checkbox" checked />
        <span>Include images</span>
      </label>
      <button id="convert" type="button">
        <span class="button-mark" aria-hidden="true">→</span>
        <span>Convert to EPUB</span>
      </button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <pre id="result" class="result" hidden></pre>
    </main>
    <script src="jszip.min.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
